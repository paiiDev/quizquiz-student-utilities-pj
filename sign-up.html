<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up</title>
    <link
      rel="stylesheet"
      href="./bootstrap-5.3.3-dist/css/bootstrap.min.css"
    />
    <script src="./bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
    <style>
      .site-name {
        font-size: 25px;
        font-weight: bold;
        color: #14125d;
      }
      body {
        background: rgb(2,0,36);
background: linear-gradient(90deg, rgba(2,0,36,1) 0%, rgba(37,37,185,1) 62%, rgba(0,22,58,1) 100%);
      }
      .cfs {
        font-size: 50px;
        color: white;
        text-shadow: 2px 2px 2px rgb(128, 128, 128);
      }
    </style>
  </head>
  <body
    class="d-flex align-items-center py-4 bg-body-tertiary"
    cz-shortcut-listen="true"
  >
    <div class="container py-4">
      <main class="form-signin col-md-6 col-lg-4 m-auto">
        <form>
          <div>
            <div class="site-name p-4 text-center cfs">QuizQuiz</div>
          </div>
          <div class="mb-3">
            <label for="formGroupExampleInput" class="form-label text-white"
              >Name</label
            >
            <input
              type="text"
              class="form-control usrName"
              id="formGroupExampleInput"
              placeholder="Enter name"
            />
          </div>
          <div class="mb-3">
            <label for="formGroupExampleInput2" class="form-label text-white email-info"
              >Email</label
            >
            <input
              type="text"
              class="form-control usrEmail"
              id="formGroupExampleInput2"
              placeholder="Enter email"
            />
          </div>
          <div class="mb-3">
            <label for="formGroupExampleInput2" class="form-label text-white pwd-info"
              >Password</label
            >
            <input
              type="password"
              class="form-control usrPassword"
              id="formGroupExampleInput3"
              placeholder="Enter password"
            />
          </div>
          <span id="showInfo" class="text-danger"></span>
          <div class="mt-5">
            <button class="btn btn-primary w-100 py-2 signUpBtn" type="submit">
              Sign-up
            </button>
          </div>
        </form>
      </main>
    </div>

    <script src="./sign-up.js"></script>
  </body>
</html>
