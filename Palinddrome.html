<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome</title>
    <link
      rel="stylesheet"
      href="./bootstrap-5.3.3-dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5 bg-body-secondary p-5 w-25">
      <div class="d-flex justify-content-center text-center">
        <form action="">
          Enter String <input type="text" class="mt-3" name="t1" id="" /> <br /><br />
          <input type="button" value="Show" class="btn btn-secondary" onclick="palindrome(t1.value)" />
        </form>
      </div>
    </div>

    <script>
      function palindrome(text) {
        var textToArray = text.split("");
        var reverseArray = textToArray.reverse();
        var arrayToString = reverseArray.join("");

        if (arrayToString === text) {
          alert("It is palindrome.");
        } else {
          alert("It is not palindrome.");
        }
      }
    </script>
  </body>
</html>
