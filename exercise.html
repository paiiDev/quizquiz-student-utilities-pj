<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise</title>
    <link
      rel="stylesheet"
      href="./bootstrap-5.3.3-dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="./bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body class="d-flex h-100 text-center cbg-themed" cz-shortcut-listen="true">

              <a class="navbar-brand text-white" href="practice.html">

              </a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar2"
                aria-controls="offcanvasNavbar2"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon navbar-dark"></span>
              </button>
              <div
                class="offcanvas offcanvas-end text-bg-dark"
                tabindex="-1"
                id="offcanvasNavbar2"
                aria-labelledby="offcanvasNavbar2Label"

                <div class="offcanvas-header">
                  <h5 class="offcanvas-title" id="offcanvasNavbar2Label">

                  <button
                    type="button"
                    class="btn-close btn-close-white"

                  ></button>
                </div>
                <div class="offcanvas-body">
                  <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                    <li class="nav-item">
                      <a
                        class="nav-link text-white"
                        aria-current="page"
                        href="./index.html"
                        >Home</a
                      >
                    </li>
                    <li class="nav-item ps-4">
                      <div class="acc-logo">
                        <a class="nav-link text-white acc-info" href="#"></a>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </nav>
        </div>
      </header>

      <!--Main-->
      <main class="mt-4 pt-4 ">
        <h1 id="info"></h1>
        <div class="container">
          <div class="d-flex justify-content-center align-items-center">
            <div class="cbg d-flex align-items-center flex-sm-row flex-column">

            <div class="d-block text-center text-sm-start  my-4 my-sm-0 ">
              <div class="bookTitle text-white px-5 fs-3">404</div>
              <div class="bookAuthor text-white px-5 py-3 fs-6">404</div>
              <div class="category text-white px-5 fs-6">404</div>
              </div>
            </div>
            
          </div>
          
          <div class="d-grid gap-2 my-5 py-3  col-6 mx-auto">
  <button class="btn btn-cc p-2"  type="button">Flash-card</button>
  <button class="btn btn-cc p-2" type="button">True / False</button>
  <button class="btn btn-cc p-2" type="button">Multiple Choice</button>

</div>
        </div>
      </main>
