<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <link rel="stylesheet" href="./bootstrap-5.3.3-dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5 bg-dark-subtle w-25 p-5">
        <div class="d-flex justify-content-center text-center">
             <form name="f1">
        <h1>Word Counter</h1>
        <input type="text" name="t1" placeholder="Enter here" class="mt-4 form-control">
        
        <br><br>
        <input type="button" value="Letter" onclick="letter()" class="btn btn-outline-secondary">
        <input type="button" value="Word" onclick="word()"  class="btn btn-outline-secondary">
        <input type="button" value="Space" onclick="space()"  class="btn btn-outline-secondary mt-3">
        <br><br>
        <h3>Output</h3>
        <input type="text" name="t2" class="form-control">
    </form>
        </div>
       
    </div>
    

    <script>
        function letter(){
            var text = f1.t1.value;
            var arr = text.split("");
            var result = arr.length;
            f1.t2.value = result;
        }
        function word(){
            var text = f1.t1.value;
            var arr = text.split(" ");
            var result = arr.length;
            f1.t2.value = result;
        }
        function space(){
            var text = f1.t1.value;
            var arr = text.split(" ");
            var result = arr.length - 1;
            f1.t2.value = result;
        }
    </script>
</body>
</html>
