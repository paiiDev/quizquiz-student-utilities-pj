<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise</title>
    <link
      rel="stylesheet"
      href="./bootstrap-5.3.3-dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="./bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body class="d-flex h-100 text-center cbg-img" cz-shortcut-listen="true">
    <div class="cover-container d-flex w-100 h-100 mx-auto flex-column">
      <header class="mb-auto">
        <div>
          <nav
            class="navbar navbar-expand-lg"
            aria-label="Offcanvas navbar large"
          >
            <div class="container-fluid">
              <a class="navbar-brand text-white" href="exercise.html">
                <img src="./images/arrow-left-solid.svg" class="cw my-2 mx-2 mx-sm-5">
              </a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar2"
                aria-controls="offcanvasNavbar2"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon navbar-dark"></span>
              </button>
              <div
                class="offcanvas offcanvas-end text-bg-dark"
                tabindex="-1"
                id="offcanvasNavbar2"
                aria-labelledby="offcanvasNavbar2Label"
              >
                <div class="offcanvas-header">
                  <h5 class="offcanvas-title" id="offcanvasNavbar2Label">
                    Menu
                  </h5>
                  <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="offcanvas-body">
                  <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                    <li class="nav-item">
                      <a
                        class="nav-link text-white"
                        aria-current="page"
                        href="./index.html"
                        >Home</a
                      >
                    </li>
                    <li class="nav-item ps-4">
                      <div class="acc-logo">
                        <a class="nav-link text-white acc-info" href="#"></a>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </nav>
        </div>
      </header>

      <!--Main-->
      <main class="mt-4 pt-4">
        <h1 id="info"></h1>
        <div class="container">
          <div class="d-flex justify-content-center align-items-center bg-blur">
            <div class="cbg2 d-block align-items-center">
              <div class="questionCount text-white px-5 fs-3 my-3"></div>
              <div class="question text-white px-5 py-4 fs-5"></div>
              <div class="d-grid gap-2 my-2 py-2 col-6  mx-auto flex-column justify-content-center align-items-center">
                <ul class="options list-unstyled  ">
                  <li>
                    <div class="btn btn-cc p-2 b1 mb-1 cw-300 text-start">
                      <input
                        type="radio"
                        name="answer"
                        id="ans1"
                        class="answer mx-2"
                      />
                      <label id="option1">Answer 1</label>
                    </div>
                  </li>
                  <li>
                    <div class="btn btn-cc p-2 b2 mb-1 text-start cw-300">
                      <input
                        type="radio"
                        name="answer"
                        id="ans2"
                        class="answer mx-2"
                      />
                      <label id="option2">Answer 2</label>
                    </div>
                  </li>
                  <li>
                    <div class="btn btn-cc p-2 b2 mb-1 cw-300 text-start">
                      <input
                        type="radio"
                        name="answer"
                        id="ans3"
                        class="answer mx-2"
                      />
                      <label id="option3">Answer 3</label>
                    </div>
                  </li>
                  <li>
                    <div class="btn btn-cc p-2 b2 mb-1 cw-300 text-start">
                      <input
                        type="radio"
                        name="answer"
                        id="ans4"
                        class="answer mx-2"
                      />
                      <label id="option4">Answer 4</label>
                    </div>
                  </li>
                </ul>
                <input type="submit" value="Submit" class="btn btn-cc p-2" id="submitBtn" >
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="./multiple-choice.js"></script>
  </body>
</html>
